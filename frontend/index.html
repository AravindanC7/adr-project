<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Questions</title>
  <link rel="stylesheet" href="style.css">
  <script src="telemetry.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="band">
    <div class="band-inner"><span class="logo" aria-hidden="true">✦</span><span id="brand">Quick Questions</span></div>
  </header>

  <main>
    <p id="error" role="alert"></p>

    <section id="start">
      <h1>Hi there 👋</h1>
      <p class="lead">Pick one to begin.</p>
      <p id="start-note" class="lead" role="status"></p>
      <ul id="assessments" class="assessments"></ul>
    </section>

    <!-- The wording comes from the server. -->
    <section id="consent" hidden>
      <h1>Before you start</h1>
      <div id="consent-text" class="card prose"></div>
      <label class="agree"><input id="agree" type="checkbox"> I am 18 or older, I have read the above and I agree to take part.</label>
      <div class="row">
        <button id="consent-yes" class="primary" type="button" disabled>I agree, start →</button>
        <button id="consent-no" class="quiet" type="button">No thanks</button>
      </div>
    </section>

    <section id="question" hidden>
      <div class="progress-row">
        <p id="progress" class="progress"></p>
        <div class="track" aria-hidden="true"><div id="bar" class="fill"></div></div>
      </div>
      <form id="form" class="card" novalidate>
        <div id="item">
          <h2 id="stem" tabindex="-1"></h2>
          <div id="answer"></div>
        </div>
        <button id="next" class="primary" type="submit" disabled>Next →</button>
      </form>
      <button id="stop" class="quiet" type="button" hidden>Stop and remove my answers</button>
    </section>

    <section id="done" hidden>
      <span class="done-emoji" aria-hidden="true">🎉</span>
      <h1>All done, thank you!</h1>
      <div class="confetti" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <!-- Pilot only: filled from the server after the last question, never part of this HTML. -->
      <div id="debrief" class="card prose" hidden></div>
      <p id="code-note" class="lead" hidden>If you want your answers removed later, email this code
        to Harshini (hbalamu1@asu.edu): <code id="code"></code></p>
      <p id="withdrawn" class="lead" role="status"></p>
      <div class="row center">
        <button id="remove" class="quiet" type="button" hidden>Remove my answers</button>
        <button id="again" class="primary" type="button">Back to the start</button>
      </div>
    </section>
  </main>
</body>
</html>
