[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adr"
version = "0.1.0"
description = "Adaptive Defense Router: choosing which AI-use check to run, item by item (CSE 576, Fall 2026)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "reportlab>=4.0",     # PDF rendering for the document-upload attacker
]

[project.optional-dependencies]
# Install only the providers you use, e.g.  pip install -e ".[anthropic,openai,dev]"
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]          # also covers OpenAI-compatible servers (vLLM, Ollama, Together, Groq)
google = ["google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "pypdf>=4"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]   # httpx: FastAPI's test client
browser = ["playwright>=1.45"]   # front-end copy test; then: python -m playwright install chromium

[tool.setuptools.packages.find]
include = ["adr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
